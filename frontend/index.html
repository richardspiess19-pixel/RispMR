<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="theme-color" content="#05060a" />
    <title>VR Box → Joy-Con</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/tokens.css" />

    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />

  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar__brand" href="#/dashboard" aria-label="Início">

          <span class="topbar__name">VR Box <span>→ Joy-Con</span></span>

        <div class="topbar__status" id="topChips" aria-label="Situação"></div>

      <div id="banner" class="mode-banner" hidden></div>
      <nav class="nav" id="nav" aria-label="Menu"></nav>
      <main id="view" class="view" tabindex="-1"></main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="scripts/main.js"></script>
