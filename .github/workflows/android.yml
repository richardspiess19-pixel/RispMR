name: android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend unit tests
        run: npm test

      - name: UI smoke test (Playwright)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Protocol reference decoders
        run: |
          python3 -m unittest discover -s integration/InputProtocol/receiver
          cc -std=c99 -Wall -Wextra -Werror integration/InputProtocol/c/test_vrbq.c -o /tmp/test_vrbq
          /tmp/test_vrbq integration/InputProtocol/fixtures/sample-v1.bin

      - name: Unit tests, lint and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
