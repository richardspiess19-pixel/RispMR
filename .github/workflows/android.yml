name: android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend and web engine unit tests
        run: npm test

      - name: UI smoke test (Playwright)
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:web

      - uses: actions/upload-artifact@v4
        with:
          name: vr-box-to-joycon-html
          path: dist/vr-box-to-joycon.html

      - name: Protocol reference decoders
        run: |
          python3 -m unittest discover -s integration/InputProtocol/receiver
          cc -std=c99 -Wall -Wextra -Werror integration/InputProtocol/c/test_vrbq.c -o /tmp/test_vrbq
          /tmp/test_vrbq integration/InputProtocol/fixtures/sample-v2.bin

      - name: Unit tests, lint and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Signed release only when the repository has the signing secrets.
      - name: Signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew --no-daemon assembleRelease
          rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
